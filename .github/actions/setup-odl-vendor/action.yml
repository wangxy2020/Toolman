name: Setup OpenDataLoader vendor
description: "Clone and build donatomm/open-data-loader-pdf for the pnpm file dependency"

runs:
  using: composite
  steps:
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Cache ODL vendor tree
      uses: actions/cache@v4
      id: odl-vendor-cache
      with:
        path: vendor/open-data-loader-pdf
        key: odl-vendor-${{ runner.os }}-${{ hashFiles('scripts/sync-opendataloader-pdf-source.sh', 'scripts/pin-opendataloader-verapdf.sh') }}-main-v2

    - name: Check ODL vendor artifacts
      id: odl-artifacts
      shell: bash
      run: |
        ODL_PKG="vendor/open-data-loader-pdf/node/opendataloader-pdf"
        if [[ -f "$ODL_PKG/lib/opendataloader-pdf-cli.jar" && -f "$ODL_PKG/dist/index.js" ]]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "ODL vendor artifacts already present; skipping Maven"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "ODL vendor artifacts missing; Maven will be required"
        fi

    - name: Install Maven (Linux)
      if: runner.os == 'Linux' && steps.odl-artifacts.outputs.present != 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v mvn >/dev/null 2>&1; then
          mvn -version
          exit 0
        fi
        # Do not use apt-get: ubuntu-latest often holds /var/lib/dpkg/lock-frontend
        # (unattended-upgrades). `apt-get install maven` then hangs for hours.
        MAVEN_VERSION=3.9.9
        curl -fsSL --retry 3 --retry-delay 2 \
          "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
          -o /tmp/maven.tgz
        sudo tar -xzf /tmp/maven.tgz -C /opt
        sudo ln -sfn "/opt/apache-maven-${MAVEN_VERSION}/bin/mvn" /usr/local/bin/mvn
        mvn -version

    - name: Install Maven (macOS)
      if: runner.os == 'macOS' && steps.odl-artifacts.outputs.present != 'true'
      shell: bash
      run: |
        if ! command -v mvn >/dev/null 2>&1; then
          brew install maven
        fi

    - name: Install Maven (Windows)
      if: runner.os == 'Windows' && steps.odl-artifacts.outputs.present != 'true'
      shell: pwsh
      run: |
        if (-not (Get-Command mvn -ErrorAction SilentlyContinue)) {
          choco install maven -y
        }

    - name: Vendor OpenDataLoader PDF
      shell: bash
      env:
        ODL_PDF_REF: main
      run: |
        ODL_PKG="vendor/open-data-loader-pdf/node/opendataloader-pdf"
        ODL_JAR="$ODL_PKG/lib/opendataloader-pdf-cli.jar"
        ODL_DIST="$ODL_PKG/dist/index.js"
        if [[ -f "$ODL_JAR" && -f "$ODL_DIST" ]]; then
          echo "ODL vendor build artifacts present; skipping sync"
          exit 0
        fi
        echo "ODL vendor incomplete; running sync"
        bash scripts/sync-opendataloader-pdf-source.sh

    - name: Verify ODL vendor package
      shell: bash
      run: |
        ODL_PKG="vendor/open-data-loader-pdf/node/opendataloader-pdf"
        test -f "$ODL_PKG/package.json" || {
          echo "::error::$ODL_PKG/package.json is missing after setup"
          exit 1
        }
        test -f "$ODL_PKG/lib/opendataloader-pdf-cli.jar" || {
          echo "::error::$ODL_PKG/lib/opendataloader-pdf-cli.jar is missing after setup"
          exit 1
        }
        test -f "$ODL_PKG/dist/index.js" || {
          echo "::error::$ODL_PKG/dist/index.js is missing after setup"
          exit 1
        }
