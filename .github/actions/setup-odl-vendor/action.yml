name: Setup OpenDataLoader vendor
description: "Clone and build donatomm/open-data-loader-pdf for the pnpm file dependency"

runs:
  using: composite
  steps:
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Cache ODL vendor tree
      uses: actions/cache@v4
      id: odl-vendor-cache
      with:
        path: vendor/open-data-loader-pdf
        key: odl-vendor-${{ runner.os }}-${{ hashFiles('scripts/sync-opendataloader-pdf-source.sh', 'scripts/pin-opendataloader-verapdf.sh') }}-main-v2

    - name: Install Maven (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y maven

    - name: Install Maven (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        if ! command -v mvn >/dev/null 2>&1; then
          brew install maven
        fi

    - name: Install Maven (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Get-Command mvn -ErrorAction SilentlyContinue)) {
          choco install maven -y
        }

    - name: Vendor OpenDataLoader PDF
      shell: bash
      env:
        ODL_PDF_REF: main
      run: |
        ODL_PKG="vendor/open-data-loader-pdf/node/opendataloader-pdf"
        ODL_JAR="$ODL_PKG/lib/opendataloader-pdf-cli.jar"
        ODL_DIST="$ODL_PKG/dist/index.js"
        if [[ -f "$ODL_JAR" && -f "$ODL_DIST" ]]; then
          echo "ODL vendor build artifacts present; skipping sync"
          exit 0
        fi
        echo "ODL vendor incomplete; running sync"
        bash scripts/sync-opendataloader-pdf-source.sh

    - name: Verify ODL vendor package
      shell: bash
      run: |
        ODL_PKG="vendor/open-data-loader-pdf/node/opendataloader-pdf"
        test -f "$ODL_PKG/package.json" || {
          echo "::error::$ODL_PKG/package.json is missing after setup"
          exit 1
        }
        test -f "$ODL_PKG/lib/opendataloader-pdf-cli.jar" || {
          echo "::error::$ODL_PKG/lib/opendataloader-pdf-cli.jar is missing after setup"
          exit 1
        }
        test -f "$ODL_PKG/dist/index.js" || {
          echo "::error::$ODL_PKG/dist/index.js is missing after setup"
          exit 1
        }
